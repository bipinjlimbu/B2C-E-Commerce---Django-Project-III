<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | BajaGaja</title>
    {% load static %}
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
</head>
<body class="bg-[#FAF7F2] text-[#5F564F] font-sans min-h-screen flex items-center justify-center p-4 selection:bg-[#7A1F2B] selection:text-white">

    <div class="max-w-md w-full bg-white border border-[#DDD2C5] rounded-3xl p-8 sm:p-10 shadow-sm text-center relative overflow-hidden">
        
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-[#C89B3C]/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-[#7A1F2B]/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="relative w-20 h-20 mx-auto mb-6 flex items-center justify-center">
            <div class="absolute inset-0 border-4 border-[#DDD2C5] rounded-full"></div>
            <div class="absolute inset-0 border-4 border-[#7A1F2B] border-t-transparent rounded-full animate-spin"></div>
            <div class="w-12 h-12 bg-[#FAF7F2] rounded-full border border-[#DDD2C5] flex items-center justify-center text-[#C89B3C] shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
        </div>

        <div class="space-y-2 mb-6">
            <h1 class="text-2xl font-extrabold text-[#2D1F18] tracking-tight">Connecting to Payment</h1>
            <p class="text-xs text-[#5F564F] leading-relaxed">Please wait a moment while we safely redirect you to the payment portal.</p>
        </div>

        <div class="bg-[#FAF7F2] border border-[#DDD2C5] rounded-2xl p-4 mb-6 flex items-center justify-between text-left">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-white border border-[#DDD2C5] flex items-center justify-center text-[#5B8A5A] shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                </div>
                <div>
                    <span class="text-[10px] font-bold text-[#5F564F] uppercase tracking-wider block">Total Amount</span>
                    <span class="text-base font-black text-[#7A1F2B]">Rs. {{ amount|floatformat:2 }}</span>
                </div>
            </div>
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#5B8A5A]/10 text-[#5B8A5A] text-[11px] font-bold">
                <span class="w-1.5 h-1.5 rounded-full bg-[#5B8A5A] animate-ping"></span>
                eSewa
            </span>
        </div>

        <div class="flex items-center justify-center gap-2 text-[11px] text-[#5F564F]">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#5B8A5A]">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>256-Bit Encrypted & Secure Connection</span>
        </div>

        <form id="esewa_form" action="{{ esewa_url }}" method="POST">
            <input type="hidden" name="amount" value="{{ amount }}">
            <input type="hidden" name="tax_amount" value="0">
            <input type="hidden" name="total_amount" value="{{ amount }}">
            <input type="hidden" name="transaction_uuid" value="{{ transaction_uuid }}">
            <input type="hidden" name="product_code" value="{{ product_code }}">
            <input type="hidden" name="product_service_charge" value="0">
            <input type="hidden" name="product_delivery_charge" value="0">
            <input type="hidden" name="success_url" value="{{ success_url }}">
            <input type="hidden" name="failure_url" value="{{ failure_url }}">
            <input type="hidden" name="signed_field_names" value="total_amount,transaction_uuid,product_code">
            <input type="hidden" name="signature" value="{{ signature }}">
        </form>

    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('esewa_form').submit();
            }, 800); 
        };
    </script>
</body>
</html>
